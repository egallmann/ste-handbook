  <g id="plate-footer-13-04-C">
    <rect class="band" x="32" y="576" width="1216" height="112" rx="8"/>
    <text class="t-foot1" x="640" y="608" text-anchor="middle">Morality Guard manufactures judgments from a joined graph, including who someone associates with.</text>
    <text class="t-foot1" x="640" y="632" text-anchor="middle">A condensed class can drive standing watches, alerts, and quiet intervention without a name search.</text>
    <text class="t-foot4" x="640" y="664" text-anchor="middle">Explanatory projection only; essay prose is authoritative if figure and text diverge.</text>
  </g>

