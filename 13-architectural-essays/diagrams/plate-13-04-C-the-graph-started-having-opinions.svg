  <title id="plate-title-13-04-C">Plate 13-04-C: The graph started having opinions</title>
  <desc id="plate-desc-13-04-C">
    Ordinary records, signals, and other-people associations feed Enrichment
    and Intelligence. Morality Guard manufactures first-order and association
    judgments, condenses them into a high concern person class, and Real-Time
    Security deploys that class to subscribers as standing watches, live alerts,
    and quiet intervention.
  </desc>

