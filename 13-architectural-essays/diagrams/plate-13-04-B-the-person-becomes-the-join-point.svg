  <title id="plate-title-13-04-B">Plate 13-04-B: The person becomes the join point</title>
  <desc id="plate-desc-13-04-B">
    Four zones. Left: observations, observable signals, public context,
    and identity, each permitted separately. Mid-left: ordinary ACME
    processing around Enrichment. Mid-right: Erik as the join point among
    employer, public mention, property, signals, vehicle X, Person B,
    household/address context, and place/time history. Right: reconstructable
    view without a canonical dossier or a name search.
  </desc>

