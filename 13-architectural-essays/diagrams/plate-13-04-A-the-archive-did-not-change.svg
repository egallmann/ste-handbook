  <rect class="canvas-bg" x="0" y="0" width="1280" height="720"/>

  <g id="plate-header-13-04-A">
    <rect class="band" x="32" y="32" width="1216" height="56" rx="8"/>
    <text class="t-header" x="48" y="68">The archive did not change</text>
    <text class="t-plate-id" x="1232" y="66" text-anchor="end">13-04-A</text>
  </g>

  <g id="plate-footer-13-04-A">
    <rect class="band" x="32" y="556" width="1216" height="132" rx="8"/>
    <text class="t-foot1" x="640" y="588" text-anchor="middle">One edge appeared. The historical observation did not become more detailed.</text>
    <text class="t-foot1" x="640" y="616" text-anchor="middle">Yesterday the path stopped at the vehicle. Today the same observations can participate in a path about Erik.</text>
    <text class="t-foot1" x="640" y="644" text-anchor="middle">Neither ACME Vision nor ACME Analytics had to become an identity company.</text>
    <text class="t-foot4" x="640" y="668" text-anchor="middle">Explanatory projection only; essay prose is authoritative if figure and text diverge.</text>
  </g>

  <rect class="frame-archive" x="32" y="96" width="1216" height="120" rx="8"/>
  <rect class="frame-yesterday" x="32" y="228" width="584" height="312" rx="8"/>
  <rect class="frame-today" x="664" y="228" width="584" height="312" rx="8"/>
  <text class="t-col" x="48" y="120">The archive did not change</text>
  <text class="t-col" x="48" y="252">Yesterday</text>
  <text class="t-col-today" x="680" y="252">Today</text>

  <g id="plate-archive-13-04-A">
    <rect class="archive-box" x="48" y="132" width="568" height="72" rx="8"/>
    <text class="t-prim" x="62" y="156">ACME Vision</text>
    <text class="t-sec" x="62" y="174">Observations of vehicle X</text>
    <text class="t-sec" x="62" y="192">Unchanged</text>
    <rect class="archive-box" x="664" y="132" width="568" height="72" rx="8"/>
    <text class="t-prim" x="678" y="156">ACME Analytics</text>
    <text class="t-sec" x="678" y="174">Candidate relationships among those observations</text>
    <text class="t-sec" x="678" y="192">Unchanged</text>
  </g>

  <g id="plate-yesterday-13-04-A">
    <text class="t-absence" x="324" y="298" text-anchor="middle">The archive did not contain Erik</text>
    <rect class="path-node" x="168" y="372" width="312" height="48" rx="8"/>
    <text class="t-prim" x="324" y="403" text-anchor="middle">vehicle X</text>
    <rect class="path-node" x="168" y="476" width="312" height="48" rx="8"/>
    <text class="t-prim" x="324" y="507" text-anchor="middle">location A</text>
  </g>

  <g id="plate-today-13-04-A">
    <rect class="source" x="680" y="268" width="104" height="48" rx="8"/>
    <text class="t-source" x="732" y="287" text-anchor="middle">Permitted</text>
    <text class="t-source" x="732" y="304" text-anchor="middle">source</text>
    <rect class="erik" x="832" y="268" width="312" height="48" rx="8"/>
    <text class="t-prim" x="988" y="299" text-anchor="middle">Erik</text>
    <rect class="path-node" x="832" y="372" width="312" height="48" rx="8"/>
    <text class="t-prim" x="988" y="403" text-anchor="middle">vehicle X</text>
    <rect class="path-node" x="832" y="476" width="312" height="48" rx="8"/>
    <text class="t-prim" x="988" y="507" text-anchor="middle">location A</text>
  </g>

  <g id="plate-connectors-13-04-A">
    <line class="conn-solid" x1="324" y1="420" x2="324" y2="468"/>
    <line class="conn-source" x1="784" y1="292" x2="824" y2="292"/>
    <line class="conn-new" x1="988" y1="316" x2="988" y2="364"/>
    <line class="conn-solid" x1="988" y1="420" x2="988" y2="468"/>
  </g>

  <g id="plate-connector-labels-13-04-A">
    <text class="t-edge" x="336" y="440">observed at</text>
    <text class="t-edge-new" x="836" y="284">associated with</text>
    <text class="t-edge" x="1000" y="440">observed at</text>
