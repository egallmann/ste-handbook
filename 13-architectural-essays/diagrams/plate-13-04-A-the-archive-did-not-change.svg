<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 720"
     width="1280"
     height="720"
     role="img"
     aria-labelledby="plate-title-13-04-A plate-desc-13-04-A">
  <title id="plate-title-13-04-A">Plate 13-04-A: The archive did not change</title>
  <desc id="plate-desc-13-04-A">
    Shared unchanged archive of ACME Vision observations and ACME Analytics
    relationships. Yesterday the traversable path is vehicle X observed at
    location A. Today a permitted source adds Erik associated with vehicle X,
    so the same observations participate in a path about Erik.
  </desc>

  <defs>
    <marker id="arrow-solid-13-04-A"
            viewBox="0 0 10 8"
            refX="9"
            refY="4"
            markerWidth="9"
            markerHeight="7"
            markerUnits="userSpaceOnUse"
            orient="auto"
            overflow="visible">
      <path d="M0,0.5 L9,4 L0,7.5 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-new-13-04-A"
            viewBox="0 0 10 8"
            refX="9"
            refY="4"
            markerWidth="9"
            markerHeight="7"
            markerUnits="userSpaceOnUse"
            orient="auto"
            overflow="visible">
      <path d="M0,0.5 L9,4 L0,7.5 Z" fill="#B45309"/>
    </marker>
    <marker id="arrow-source-13-04-A"
            viewBox="0 0 10 8"
            refX="9"
            refY="4"
            markerWidth="9"
            markerHeight="7"
            markerUnits="userSpaceOnUse"
            orient="auto"
            overflow="visible">
      <path d="M0,0.5 L9,4 L0,7.5 Z" fill="#D97706"/>
    </marker>

    <style type="text/css"><![CDATA[
      .canvas-bg { fill: #FFFFFF; }
      .band { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1; }
      .frame-archive { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.5; }
      .frame-yesterday { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .frame-today { fill: #FFFBEB; stroke: #D97706; stroke-width: 2; }
      .archive-box { fill: #F8FAFC; stroke: #475569; stroke-width: 1.5; }
      .path-node { fill: #EEF2FF; stroke: #4338CA; stroke-width: 1.5; }
      .erik { fill: #FEF3C7; stroke: #B45309; stroke-width: 2.5; }
      .source { fill: #FFFBEB; stroke: #D97706; stroke-width: 1.5; }
      .conn-solid { fill: none; stroke: #334155; stroke-width: 2; stroke-linecap: butt; marker-end: url(#arrow-solid-13-04-A); }
      .conn-new { fill: none; stroke: #B45309; stroke-width: 2.5; stroke-linecap: butt; marker-end: url(#arrow-new-13-04-A); }
      .conn-source { fill: none; stroke: #D97706; stroke-width: 1.5; stroke-linecap: butt; marker-end: url(#arrow-source-13-04-A); }
      .t-header { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #0F172A; }
      .t-plate-id { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .t-col { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .t-col-today { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #B45309; }
      .t-prim { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #0F172A; }
      .t-sec { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #334155; }
      .t-absence { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #64748B; }
      .t-edge { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }
      .t-edge-new { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #B45309; }
      .t-source { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0F172A; }
      .t-foot1 { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 14px; font-weight: 500; fill: #0F172A; }
      .t-foot4 { font-family: Inter, "Helvetica Neue", Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; }

      @media (prefers-color-scheme: dark) {
        .canvas-bg { fill: #0D1117; }
        .band { fill: #161B22; stroke: #30363D; }
        .frame-archive { fill: #0D1117; stroke: #30363D; }
        .frame-yesterday { fill: #0D1117; stroke: #30363D; }
        .frame-today { fill: #2A2111; stroke: #D29922; }
        .archive-box { fill: #21262D; stroke: #8B949E; }
        .path-node { fill: #1C2333; stroke: #818CF8; }
        .erik { fill: #3D2E12; stroke: #D29922; }
        .source { fill: #2A2111; stroke: #D29922; }
        .conn-solid { stroke: #C9D1D9; }
        .conn-new { stroke: #D29922; }
        .conn-source { stroke: #D29922; }
        #arrow-solid-13-04-A path { fill: #C9D1D9; }
        #arrow-new-13-04-A path { fill: #D29922; }
        #arrow-source-13-04-A path { fill: #D29922; }
        .t-header, .t-prim, .t-source, .t-foot1 { fill: #F0F6FC; }
        .t-plate-id, .t-absence, .t-foot4 { fill: #8B949E; }
        .t-col, .t-sec, .t-edge { fill: #C9D1D9; }
        .t-col-today, .t-edge-new { fill: #D29922; }
      }
    ]]></style>
